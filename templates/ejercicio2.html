
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>

    <div class="formulario-nombres">
        <form action="/ejercicio2" method="post">
            <label>Nombre 1:</label>
            <input type="text" name="nombre1" value="{{ nombre1 }}" required>

            <label>Nombre 2:</label>
            <input type="text" name="nombre2" value="{{ nombre2 }}" required>

            <label>Nombre 3:</label>
            <input type="text" name="nombre3" value="{{ nombre3 }}" required>

            <button type="submit">Enviar</button>
        </form>

        {% if nombre_largo is not none %}
            <p class="resultado-nombre">El nombre con mayor cantidad de caracteres es: {{ nombre_largo }}</p>
            <p>El nombre tiene: {{ cantidad }} caracteres</p>
        {% endif %}

        {% if mensaje %}
            <p>{{ mensaje }}</p>
        {% endif %}
    </div>

</body>
</html>
